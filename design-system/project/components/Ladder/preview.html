<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Ladder — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"><style>html,body{margin:0;background:var(--ground);color:var(--white)} body{font-family:var(--font-stroke);padding:12px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap} svg{shape-rendering:crispEdges;display:block} .cap{font-size:14px;letter-spacing:.08em;color:var(--grey)} .lad{display:flex;flex-direction:column-reverse;gap:4px;width:20px} .lad i{display:block;height:6px;background:var(--dim)} .col{display:flex;flex-direction:column;gap:6px;align-items:center} .cap{font-size:14px}</style></head><body>
<div class="col"><span class="cap">CTX</span><div class="lad" id="ctx"></div></div><div class="col"><span class="cap">5H</span><div class="lad" id="h5"></div></div><div class="col"><span class="cap">7D</span><div class="lad" id="d7"></div></div><script>function lad(id,p){var e=document.getElementById(id),n=10,lit=Math.round(p/100*n);for(var i=0;i<n;i++){var s=document.createElement("i");if(i<lit)s.style.background=i>=n*.85?"var(--red)":i>=n*.6?"var(--orange)":"var(--green)";e.appendChild(s)}}lad("ctx",62);lad("h5",38);lad("d7",91)</script>
</body></html>
