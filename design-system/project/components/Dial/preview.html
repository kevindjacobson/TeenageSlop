<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Dial — preview</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap"><style>html,body{margin:0;background:var(--ground);color:var(--white)} body{font-family:var(--font-stroke);padding:12px;display:flex;gap:24px;align-items:flex-end;flex-wrap:wrap} svg{shape-rendering:crispEdges;display:block} .cap{font-size:14px;letter-spacing:.08em;color:var(--grey)} .d{display:flex;flex-direction:column;align-items:center;width:96px} .v{font-size:35px;line-height:40px}</style></head><body>
<script>function dial(l,v,p,c){var r=34,cx=48,cy=44,a0=200,a1=340,a=(a0+(a1-a0)*Math.min(1,v/p))*Math.PI/180;function P(d,rr){var t=d*Math.PI/180;return (cx+Math.cos(t)*rr).toFixed(1)+" "+(cy+Math.sin(t)*rr).toFixed(1)}var ticks="";for(var k=0;k<=4;k++){ticks+="<line x1=\""+P(a0+k*35,r+3).replace(" ","\" y1=\"")+"\" x2=\""+P(a0+k*35,r+7).replace(" ","\" y2=\"")+"\" stroke=\"var(--grey)\" stroke-width=\"1\"/>"}document.write("<div class=\"d\"><svg width=\"96\" height=\"56\" viewBox=\"0 0 96 56\"><path d=\"M "+P(a0,r)+" A "+r+" "+r+" 0 0 1 "+P(a1,r)+"\" fill=\"none\" stroke=\"var(--grey)\" stroke-width=\"1\"/>"+ticks+"<line x1=\""+cx+"\" y1=\""+cy+"\" x2=\""+(cx+Math.cos(a)*(r-4)).toFixed(1)+"\" y2=\""+(cy+Math.sin(a)*(r-4)).toFixed(1)+"\" stroke=\""+c+"\" stroke-width=\"2\"/><circle cx=\""+cx+"\" cy=\""+cy+"\" r=\"2\" fill=\""+c+"\"/></svg><span class=\"v\" style=\"color:"+c+"\">"+String(v).padStart(2,"0")+"</span><span class=\"cap\">"+l+"</span></div>")}dial("READ",12,12,"var(--white)");dial("EDIT",4,12,"var(--blue)");dial("SHELL",7,12,"var(--green)")</script>
</body></html>
